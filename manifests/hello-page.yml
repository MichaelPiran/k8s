apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-page
  namespace: demo
data:
  index.html: |
    <!doctype html>
    <html lang="it">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Hello Kubernetes</title>
        <style>
          body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: sans-serif; background: #f4f7f5; color: #17201b; }
          main { padding: 3rem; border-left: 8px solid #2f855a; background: white; box-shadow: 0 12px 35px rgba(0, 0, 0, .1); }
          h1 { margin: 0 0 1rem; font-size: clamp(2rem, 8vw, 5rem); }
          p { margin: 0; font-size: 1.2rem; }
        </style>
      </head>
      <body>
        <main>
          <h1>Hello World!</h1>
          <p>Questa pagina e servita da Nginx su Kubernetes.</p>
        </main>
      </body>
    </html>